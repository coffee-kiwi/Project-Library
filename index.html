<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <Header>
        <h1>The Library</h1>
    </Header>

    <main>

        <section id="book-container">

        </section>

        <div>
            <button command="show-modal" commandfor="new-book-dialog">Add a new book?</button>

            <dialog id="new-book-dialog">
                <p>Does it open?</p>
                <form action="dialog" id="book-form">
                    <h2>Add a book to the library</h2>
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" autofocus required>

                        <label for="author">Author:</label>
                        <input type="text" id="author" name="author">

                        <label for="pages">Number of pages:</label>
                        <input type="text" name="pages" id="pages">

                        <label for="read">Have you read it?</label>
                        <select name="read" id="read">
                            <option value="Yes" selected>Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="form-actions">

                        <button type="submit" id="addBtn" value="add">Add Book</button>
                    </div>
                </form>

                <button commandfor="new-book-dialog" command="close">Cancel</button>
            </dialog>
        </div>
        <output></output>
    </main>
    
</body>
</html>
